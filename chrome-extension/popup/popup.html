<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>営業OS Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.active { background: #22c55e; }
    .title { font-weight: 700; font-size: 14px; color: #1e293b; }
    .section { margin-bottom: 12px; }
    .label { color: #64748b; font-size: 11px; margin-bottom: 4px; }
    .pending-count { font-weight: 700; font-size: 22px; color: #7c3aed; line-height: 1; }
    .pending-unit { font-size: 11px; color: #94a3b8; margin-left: 3px; }
    input[type="url"] {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      color: #334155;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="url"]:focus { border-color: #7c3aed; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-sec { background: #f1f5f9; color: #475569; }
    .btn-sec:hover { background: #e2e8f0; }
    .msg {
      margin-top: 8px;
      font-size: 11px;
      color: #22c55e;
      text-align: center;
      min-height: 16px;
    }
    .divider { border: none; border-top: 1px solid #f1f5f9; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="dot"></div>
    <span class="title">営業OS Bridge</span>
  </div>

  <div class="section">
    <div class="label">受信待ち</div>
    <div>
      <span class="pending-count" id="pendingCount">-</span>
      <span class="pending-unit">件</span>
    </div>
  </div>

  <hr class="divider" />

  <div class="section">
    <div class="label">送信先URL</div>
    <input type="url" id="webappUrl" placeholder="https://divizero.vercel.app" />
  </div>

  <button class="btn btn-primary" id="saveBtn">保存</button>
  <button class="btn btn-sec" id="openBtn">営業OSを開く</button>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
