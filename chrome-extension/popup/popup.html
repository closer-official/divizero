<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>営業OS Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #fff;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .icon { width: 28px; height: 28px; background: #7c3aed; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .title { font-weight: 700; font-size: 14px; }
    ol { padding-left: 18px; line-height: 2; color: #475569; font-size: 12px; }
    .badge { display: inline-block; background: #7c3aed; color: #fff; border-radius: 4px; padding: 1px 5px; font-size: 11px; white-space: nowrap; }
    .note { margin-top: 12px; font-size: 11px; color: #94a3b8; background: #f8fafc; border-radius: 8px; padding: 8px 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">📋</div>
    <span class="title">営業OS Bridge</span>
  </div>
  <ol>
    <li>X でフォロワー / 検索を開く</li>
    <li><span class="badge">📋 OS0候補をコピー</span> を押す</li>
    <li>営業OS の <strong>OS⓪</strong> タブを開く</li>
    <li>「拡張データ貼り付け」欄に貼り付け</li>
    <li>「展開」→ 候補確認 → 全件追加</li>
  </ol>
  <div class="note">ユーザーカードが表示されているページでボタンが出現します。</div>
</body>
</html>
