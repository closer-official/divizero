<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>営業OS Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #fff;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .icon { width: 28px; height: 28px; background: #7c3aed; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .title { font-weight: 700; font-size: 14px; }
    .flow {
      background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 11px; color: #5b21b6; line-height: 1.9;
    }
    .flow strong { display: block; font-size: 12px; color: #4c1d95; margin-bottom: 4px; }
    .divider { border: none; border-top: 1px solid #f1f5f9; margin: 12px 0; }
    .section-label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .row label { font-size: 12px; color: #475569; }
    input[type="number"], select, input[type="url"] {
      border: 1px solid #e2e8f0; border-radius: 6px; padding: 4px 8px;
      font-size: 12px; color: #334155; outline: none; background: #fff;
    }
    input[type="number"] { width: 64px; text-align: center; }
    select { padding-right: 4px; }
    input[type="url"] { width: 100%; margin-top: 4px; }
    .btn {
      width: 100%; border: none; border-radius: 6px; padding: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 8px;
      background: #7c3aed; color: #fff; transition: background 0.15s;
    }
    .btn:hover { background: #6d28d9; }
    .msg { margin-top: 8px; font-size: 11px; color: #22c55e; text-align: center; min-height: 16px; }
    .cache-note { font-size: 10px; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">📋</div>
    <span class="title">営業OS Bridge</span>
  </div>

  <div class="flow">
    <strong>使い方</strong>
    ① X でフォロワー/検索を開く<br>
    ② 「📋 OS0プロンプトを生成」を押す<br>
    ③ Geminiが自動で開く → 貼り付けて実行<br>
    ④ 営業OS OS⓪ にAI出力を貼り付けて登録
  </div>

  <hr class="divider" />

  <div class="section-label">設定</div>

  <div class="row">
    <label>送信先AI</label>
    <select id="aiTarget">
      <option value="gemini">Gemini</option>
      <option value="chatgpt">ChatGPT</option>
      <option value="claude">Claude</option>
    </select>
  </div>

  <div class="row">
    <label>最大取得件数</label>
    <input type="number" id="maxAccounts" min="5" max="50" step="5" value="20" />
  </div>

  <div>
    <label class="section-label">営業OS URL（プロンプト取得先）</label>
    <input type="url" id="webappUrl" placeholder="https://divizero.vercel.app" />
    <div class="cache-note" id="cacheNote"></div>
  </div>

  <button class="btn" id="saveBtn">保存</button>
  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
